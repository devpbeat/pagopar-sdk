name: Publish Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build docs site
        run: uv run --extra docs mkdocs build

      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Enable Pages with admin token
        id: enable_pages
        if: steps.configure_pages.outcome == 'failure' && secrets.PAGES_ADMIN_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN }}

      - name: Validate Pages setup
        if: steps.configure_pages.outcome == 'failure' && steps.enable_pages.outcome != 'success'
        run: |
          echo "::error::GitHub Pages is not enabled and this workflow cannot enable it with GITHUB_TOKEN."
          echo "::error::Either enable Pages in Settings > Pages with source 'GitHub Actions', or add a repo secret named PAGES_ADMIN_TOKEN (PAT with repo/pages permissions)."
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
