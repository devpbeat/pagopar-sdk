site_name: Pagopar SDK Wiki
site_description: Documentation and framework integration guides for pagopar-sdk
site_url: https://devpbeat.github.io/pagopar-sdk/
repo_url: https://github.com/devpbeat/pagopar-sdk
repo_name: devpbeat/pagopar-sdk

theme:
  name: mkdocs

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            Home: Home
            Installation: Installation
            Django Example: Django Example
            FastAPI Example: FastAPI Example
            Flask Example: Flask Example
            Contributing: Contributing
            PyPI Publishing: PyPI Publishing
            Wiki Generator: Wiki Generator
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Installation: Instalación
            Django Example: Ejemplo Django
            FastAPI Example: Ejemplo FastAPI
            Flask Example: Ejemplo Flask
            Contributing: Contribuir
            PyPI Publishing: Publicación en PyPI
            Wiki Generator: Generación de Wiki

nav:
  - Home: index.md
  - Installation: installation.md
  - Django Example: django-example.md
  - FastAPI Example: fastapi-example.md
  - Flask Example: flask-example.md
  - Contributing: contributing.md
  - PyPI Publishing: pypi-publishing.md
  - Wiki Generator: wiki-generation.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
