[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "pagopar-sdk"
version = "0.1.1"
description = "Typed Python SDK for Pagopar commerce and recurrent payment APIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "devpbeat" }]
keywords = ["pagopar", "payments", "checkout", "sdk", "python"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/devpbeat/pagopar-sdk"
Documentation = "https://devpbeat.github.io/pagopar-sdk/"
Repository = "https://github.com/devpbeat/pagopar-sdk"
Issues = "https://github.com/devpbeat/pagopar-sdk/issues"

[project.optional-dependencies]
dev = [
	"pytest>=8.3.0",
	"ruff>=0.12.0",
]
docs = [
	"mkdocs>=1.6.0",
	"mkdocs-static-i18n>=1.2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pagopar_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100
